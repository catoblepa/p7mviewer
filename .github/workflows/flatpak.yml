name: Build Flatpak

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - uses: actions/checkout@v5

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.catoblepa.p7mviewer.yaml
          bundle: io.github.catoblepa.p7mviewer.flatpak
          cache: true
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak bundle as artifact
        uses: actions/upload-artifact@v5
        with:
          name: p7mviewer-flatpak
          path: io.github.catoblepa.p7mviewer.flatpak

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: io.github.catoblepa.p7mviewer.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
