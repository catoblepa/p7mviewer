app-id: io.github.catoblepa.p7mviewer
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: p7mviewer.py
separate-locales: false
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
modules:
  - name: asn1crypto
    buildsystem: simple
    build-commands:
      - python3 setup.py install --prefix=/app
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/source/a/asn1crypto/asn1crypto-1.5.1.tar.gz
        sha256: 13ae38502be632115abf8a24cbe5f4da52e3b5231990aff31123c805306ccb9c
        x-checker-data:
          type: pypi
          name: asn1crypto
  - name: pypdf
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-index --find-links=. pypdf
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/5b/ef/11ed995bd10a1632f7fea3da38ae8d42bc3ccc5b9969fe04d8620c844408/pypdf-7.1.1-py3-none-any.whl
        sha256: 04c5680d4b4cfa04ab505b09393fc949860c34a4dad6565284d11a2f5c3ce8b1
        x-checker-data:
          type: pypi
          name: pypdf
          packagetype: bdist_wheel
  - name: p7mviewer
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app
    sources:
      - type: dir
        path: ./